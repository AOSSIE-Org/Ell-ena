name: Deploy to Play Store & GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Prepare Play Store credentials
        id: play
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -n "$PLAY_STORE_JSON_KEY" ]; then
            printf '%s\n' "$PLAY_STORE_JSON_KEY" > service_account.json
            echo "has_service_account=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_service_account=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PLAY_STORE_JSON_KEY is not configured. Skipping Play Store deployment."
          fi

      - name: Prepare compile-time config
        id: config
        env:
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
        run: |
          if [ -n "$ENV_FILE_BASE64" ]; then
            echo "$ENV_FILE_BASE64" | base64 --decode > .env
            echo "mode=file" >> "$GITHUB_OUTPUT"
          else
            echo "mode=flags" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android App Bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CONFIG_MODE: ${{ steps.config.outputs.mode }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OAUTH_REDIRECT_URL: ${{ secrets.OAUTH_REDIRECT_URL }}
        run: |
          define_args=()
          if [ "$CONFIG_MODE" = "file" ]; then
            define_args+=(--dart-define-from-file=.env)
          else
            define_args+=(
              --dart-define=SUPABASE_URL="$SUPABASE_URL"
              --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
              --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
            )
            if [ -n "$OAUTH_REDIRECT_URL" ]; then
              define_args+=(--dart-define=OAUTH_REDIRECT_URL="$OAUTH_REDIRECT_URL")
            fi
          fi
          flutter build appbundle --release "${define_args[@]}"

      - name: Build universal APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CONFIG_MODE: ${{ steps.config.outputs.mode }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OAUTH_REDIRECT_URL: ${{ secrets.OAUTH_REDIRECT_URL }}
        run: |
          define_args=()
          if [ "$CONFIG_MODE" = "file" ]; then
            define_args+=(--dart-define-from-file=.env)
          else
            define_args+=(
              --dart-define=SUPABASE_URL="$SUPABASE_URL"
              --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
              --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"
            )
            if [ -n "$OAUTH_REDIRECT_URL" ]; then
              define_args+=(--dart-define=OAUTH_REDIRECT_URL="$OAUTH_REDIRECT_URL")
            fi
          fi
          flutter build apk --release "${define_args[@]}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ellena-android
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload to Play Store internal track
        if: steps.play.outputs.has_service_account == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service_account.json
          packageName: org.aossie.ellena
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Read version from pubspec.yaml
        id: version
        run: |
          version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
